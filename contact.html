<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/wrench-screwdriver-3-48.png">
    <title>Student Fix : Votre Solution Réparatrice étudiante</title>
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto:300,400,500,700" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="demo-layout-transparent mdl-layout mdl-js-layout">
        <header class="mdl-layout__header mdl-layout__header--transparent">
            <div class="mdl-layout__header-row">
                <!-- Title -->
                <img src="assets/wrench-screwdriver-3-48.png" alt="icon" class="nav-icon">

                <a href="index.html" class="mdl-layout-title"> Student Fix </a>
                <!-- Add spacer, to align navigation to the right -->
                <div class="mdl-layout-spacer">

                </div>
                <!-- Navigation -->
                <nav class="mdl-navigation">
                    <a class="mdl-navigation__link" href="index.html">Accueil</a>
                    <a class="mdl-navigation__link" href="contact.html">Contacte</a>
                </nav>
            </div>
        </header>
        <main class="mdl-layout__content">
            <div class="banner">
                <header class="mdl-layout__header mdl-layout__header--transparent">

                </header>

                <div class="hero">
                    <p class="bannerText"> Contacte </p>
                </div>
            </div>
            <div class="formContact mdl-grid">
                <div class="mdl-cell mdl-cell--6-col mdl-cell--12-col-phone">
                    <div class="mdl-card mdl-shadow--2dp mdl-card-contact">
                        <div class="mdl-card__title">
                            <h2 class="mdl-card__title-text">Contactez-nous</h2>
                        </div>

                        <div class="mdl-card__supporting-text">
                            <form id="formContact">

                                <!-- Nom -->
                                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                                    <input class="mdl-textfield__input" type="text" id="nom" required>
                                    <label class="mdl-textfield__label" for="nom">Nom</label>
                                </div>

                                <!-- Prénom -->
                                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                                    <input class="mdl-textfield__input" type="text" id="prenom" required>
                                    <label class="mdl-textfield__label" for="prenom">Prénom</label>
                                </div>

                                <!-- Email -->
                                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                                    <input class="mdl-textfield__input" type="email" id="email" required>
                                    <label class="mdl-textfield__label" for="email">Adresse courriel</label>
                                </div>

                                <!-- Message -->
                                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                                    <textarea class="mdl-textfield__input" type="text" rows="3" id="message"
                                        required></textarea>
                                    <label class="mdl-textfield__label" for="message">Votre message</label>
                                </div>

                                <!-- Submit -->
                                <div class="mdl-card__actions">
                                    <button type="submit"
                                        class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
                                        Envoyer
                                    </button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>


        </main>
        <footer class="customFooter">
            <!-- Validateur footer -->
            <p> HTML5 et CSS3 Validé </p>
            <div>
                <span>
                    <a href="http://validator.w3.org/check?uri=referer">
                        <img src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 5" height="31" width="88">
                    </a>
                </span>
                <span>
                    <a href="http://validator.w3.org/check?uri=referer">
                        <img src="https://dev.w3.org/validator/htdocs/images/valid_icons/valid-css-blue.png"
                            alt="Valid CSS 3" height="31" width="88">
                    </a>
                </span>
            </div>
        </footer>

    </div>


</body>

</html>
